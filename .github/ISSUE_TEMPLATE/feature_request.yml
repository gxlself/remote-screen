name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How would you like it to work? Alternatives you considered are welcome too.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - iOS / iPadOS app
        - Android app
        - Desktop controller
        - Remote Host (macOS / Windows / Linux)
        - Protocol / security
        - Docs / build
