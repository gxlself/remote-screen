[package]
name = "rs-desktop"
description = "Desktop (macOS / Windows) controller for Remote Screen: shared logic and platform glue (M3 V6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
rs-mobile.workspace = true
rsp-core.workspace = true
rsp-client.workspace = true
rsp-transport.workspace = true
p256 = { workspace = true, features = ["pkcs8"] }
getrandom.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
sha2.workspace = true
tracing.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
host-core.workspace = true
host-fake.workspace = true
host-win.workspace = true
tokio = { workspace = true, features = ["test-util"] }
