[package]
name = "rs-host-agent"
description = "Remote Screen host agent: capture, streaming, pairing, and input control."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "rs-host"
path = "src/main.rs"

[features]
default = []
fake = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
host-core.workspace = true
host-fake.workspace = true
rsp-core.workspace = true
if-addrs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
host-mac.workspace = true

[target.'cfg(windows)'.dependencies]
host-win.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
host-linux.workspace = true
