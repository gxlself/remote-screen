[package]
license = "MIT OR Apache-2.0"
name = "rsp-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
arbitrary = "1"
libfuzzer-sys = "0.4"
prost = "0.14"
rsp-core = { path = "../crates/rsp-core" }
rsp-transport = { path = "../crates/rsp-transport" }
host-win = { path = "../crates/host-win" }
p256 = { version = "0.14.0", features = ["ecdsa"] }
sha2 = "0.11.1"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }

[profile.release]
debug = 1

[[bin]]
name = "input_event"
path = "fuzz_targets/input_event.rs"
test = false
doc = false
bench = false

