[package]
name = "remote-screen-desktop"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[lib]
name = "remote_screen_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]

[dependencies]
rs-desktop = { path = "../../crates/rs-desktop" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1.44"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
